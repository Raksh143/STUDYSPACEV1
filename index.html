let state=loadState();let currentView='dashboard',activeSubject='science',syllabusFilter='all',showAddChapter=false,selectedDate=todayISO(),calendarCursor=new Date(),focusMode=false;let toastTimer=null;

function fmtDate(d,opts={month:'short',day:'numeric'}){if(!d)return '—';const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString(undefined,opts)}
function fmtTime(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}

function heatCells(days=91){const end=new Date();const cells=[];end.setHours(12,0,0,0);const start=new Date(end);start.setDate(end.getDate()-(days-1));const offset=start.getDay();start.setDate(start.getDate()-offset);for(let i=0;i<days+offset;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=todayISODate(d),mins=Math.round(studySeconds(iso)/60);const level=mins===0?0:mins<30?1:mins<90?2:mins<180?3:4;cells.push(`<div class="heat-cell ${level===0?'empty':''}" data-level="${level}" title="${fmtDate(iso,{month:'short',day:'numeric',year:'numeric'})}: ${mins} min"></div>`)}return cells.join('')}
function quoteOfDay(){const q=[['“The secret of getting ahead is getting started.”','Mark Twain'],['“It always seems impossible until it’s done.”','Nelson Mandela'],['“Small progress is still progress.”','A daily reminder'],['“The expert in anything was once a beginner.”','Helen Hayes'],['“You don’t have to be perfect to make progress.”','A daily reminder'],['“Great things are done by a series of small things brought together.”','Vincent van Gogh'],['“Focus on the step in front of you, not the whole staircase.”','A daily reminder']];const n=Math.floor(new Date().setHours(0,0,0,0)/86400000)%q.length;return q[n]}
function renderDashboard(){const all=getAllItems(),pct=completion(all),today=studySeconds(todayISO()),streak=streakCount(),next=dueEvents().slice(0,3),tasks=state.tasks.filter(t=>t.date===todayISO()).slice(0,5),weekly=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return {label:d.toLocaleDateString(undefined,{weekday:'short'}),minutes:Math.round(studySeconds(todayISODate(d))/60)}});const max=Math.max(60,...weekly.map(x=>x.minutes));const weeklyTotal=weekly.reduce((a,x)=>a+x.minutes,0);const quote=quoteOfDay();return `<div class="grid bento">

iv></div>

function renderAnalytics(){const all=getAllItems(),done=all.filter(i=>itemIsComplete(i)).length,confidenceItems=all.filter(i=>['science','maths','sst'].includes(i.subject)),weak=confidenceItems.filter(i=>i.confidence==='Weak').length,okay=confidenceItems.filter(i=>i.confidence==='Okay').length,strong=confidenceItems.filter(i=>i.confidence==='Strong').length;const checks=all.reduce((n,i)=>n+Object.values(i.checks||{}).filter(Boolean).length,0),possible=all.reduce((n,i)=>n+Object.keys(i.checks||{}).length,0);const revTotal=all.reduce((n,i)=>n+['Revision 1','Revision 2'].filter(k=>i.checks?.[k]).length,0),revPossible=all.reduce((n,i)=>n+Object.keys(i.checks||{}).filter(k=>k.startsWith('Revision')).length,0);const week=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return {label:d.toLocaleDateString(undefined,{weekday:'short'}),mins:Math.round(studySeconds(todayISODate(d))/60)}});const max=Math.max(60,...week.map(x=>x.mins));const bySubject=Object.entries(SUBJECTS).map(([k,s])=>({name:s.short,seconds:state.sessions.filter(x=>x.subject===s.label).reduce((a,x)=>a+x.seconds,0)}));const papers=Object.values(state.papers).flat();const paperDone=papers.filter(p=>p.done).length;return `<div class="section-head"><div><h2>Progress analytics</h2><p>Measure consistency, syllabus completion and preparation quality.</p></div><span class="tag good">Updated automatically</span></div><div class="analytics-grid">
<div class="card stat-card" style="grid-column:span 3"><div class="stat-top">SYLLABUS DONE <span>▤</span></div><div class="stat-value">${Math.round(done/all.length*100)}%</div><div class="stat-foot">${done} / ${all.length} chapters and units</div></div><div class="card stat-card" style="grid-column:span 3"><div class="stat-top">FOCUSED TIME <span>◷</span></div><div class="stat-value">${fmtHours(allStudySeconds())}</div><div class="stat-foot">${state.sessions.length} sessions recorded</div></div><div class="card stat-card" style="grid-column:span 3"><div class="stat-top">CURRENT STREAK <span>🔥</span></div><div class="stat-value">${streakCount()} days</div><div class="stat-foot">Longest streak: ${longestStreak()} days</div></div><div class="card stat-card" style="grid-column:span 3"><div class="stat-top">SAMPLE PAPERS <span>📝</span></div><div class="stat-value">${paperDone}/64</div><div class="stat-foot">Across English, Maths, Science and SST</div></div>
<div class="card wide-7"><div class="card-head"><div><div class="card-title">Study time · last 7 days</div><div class="tiny muted">Minutes of focused work</div></div></div><div class="chart-bars">${week.map(w=>`<div class="bar-col"><div class="bar-value">${w.mins? w.mins+'m':''}</div><div class="bar" style="height:${Math.max(2,w.mins/max*100)}%"></div><div class="bar-label">${w.label}</div></div>`).join('')}</div></div>
<div class="card wide-5"><div class="card-head"><div class="card-title">Confidence distribution</div></div><div class="legend-list">${[['Weak',weak,'var(--bad)'],['Okay',okay,'var(--warn)'],['Strong',strong,'var(--good)']].map(([n,v,c])=>`<div><div class="legend-line"><span class="legend-name"><i class="legend-dot" style="background:${c}"></i>${n}</span><strong>${v} · ${Math.round(v/(confidenceItems.length||1)*100)}%</strong></div><div class="progress" style="margin-top:7px"><span style="width:${v/(confidenceItems.length||1)*100}%;background:${c}"></span></div></div>`).join('')}</div><div class="tiny muted" style="margin-top:13px">Confidence ratings are tracked for Science, Mathematics and Social Science.</div></div>
<div class="card wide-6"><div class="card-head"><div class="card-title">Subject-wise completion</div></div><div class="subject-progress">${Object.entries(SUBJECTS).map(([k,s])=>{const items=state.syllabus[k]||[],p=completion(items,k);return `<div class="subject-row"><span class="name">${s.icon} ${s.short}</span><div class="progress"><span style="width:${p}%"></span></div><strong>${p}%</strong></div>`}).join('')}</div></div>
<div class="card wide-6"><div class="card-head"><div class="card-title">Revision progress</div><strong>${revPossible?Math.round(revTotal/revPossible*100):0}%</strong></div><div class="stat-value">${revTotal}<span style="font-size:14px;color:var(--muted)"> / ${revPossible}</span></div><div class="tiny muted">Revision checkboxes completed</div><div class="progress" style="margin-top:12px"><span style="width:${revPossible?revTotal/revPossible*100:0}%"></span></div><div class="divider"></div><div class="legend-line"><span class="muted">All learning checkboxes</span><strong>${checks}/${possible}</strong></div></div>
<div class="card wide-7"><div class="card-head"><div class="card-title">Consistency · last 13 weeks</div><span class="tiny muted">${activeDays().length} active days in total</span></div><div class="heatmap">${heatCells(91)}</div><div class="row" style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><span class="tiny muted">Less</span><div class="heat-legend">${[0,1,2,3,4].map(n=>`<span class="heat-cell ${n===0?'empty':''}" data-level="${n}"></span>`).join('')}</div><span class="tiny muted">More</span></div></div>
<div class="card wide-5"><div class="card-head"><div class="card-title">Study time by subject</div></div>${bySubject.some(x=>x.seconds)?`<div class="legend-list">${bySubject.map(x=>`<div><div class="legend-line"><span>${esc(x.name)}</span><strong>${fmtHours(x.seconds)}</strong></div><div class="progress" style="margin-top:6px"><span style="width:${allStudySeconds()?x.seconds/allStudySeconds()*100:0}%"></span></div></div>`).join('')}</div>`:`<div class="empty-state">Record focused sessions to see subject-wise study time.</div>`}</div>
</div>`}
function longestStreak(){const days=activeDays();if(!days.length)return 0;let best=1,cur=1;for(let i=1;i<days.length;i++){const prev=new Date(days[i-1]+'T12:00:00'),next=new Date(days[i]+'T12:00:00');if((next-prev)/86400000===1){cur++;best=Math.max(best,cur)}else cur=1}return best}
function renderSettings(){return `<div class="section-head"><div><h2>Settings & data</h2><p>Personalise StudySpace and keep your progress backed up.</p></div><span class="tag good">Auto-save on</span></div><div class="settings-grid"><div class="card"><div class="card-head"><div class="card-title">Appearance</div><span class="stat-icon">◐</span></div><div class="toggle-row"><div><strong>Dark mode</strong><small>Switch between dark and light appearance.</small></div><label class="switch"><input type="checkbox" data-action="theme-switch" ${state.theme==='dark'?'checked':''}><span class="slider-switch"></span></label></div><div class="toggle-row"><div><strong>Daily study goal</strong><small>Target focused study minutes per day.</small></div><div style="width:90px"><input class="field input" type="number" min="15" max="1440" value="${state.settings.dailyGoal}" data-setting="dailyGoal" style="width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px"></div></div><div class="toggle-row"><div><strong>Weekly study goal</strong><small>Target focused study minutes per week.</small></div><div style="width:90px"><input class="field input" type="number" min="60" max="10080" value="${state.settings.weeklyGoal}" data-setting="weeklyGoal" style="width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px"></div></div></div>
<div class="card"><div class="card-head"><div class="card-title">Data management</div><span class="stat-icon">⬇</span></div><div class="toggle-row"><div><strong>Export full backup</strong><small>Download syllabus, history, dates and settings as JSON.</small></div><button class="btn primary small" data-action="export">Export JSON</button></div><div class="toggle-row"><div><strong>Import backup</strong><small>Restore a previously exported StudySpace file.</small></div><button class="btn small" data-action="import">Choose file</button></div><div class="tiny muted" style="margin-top:12px">Import replaces the data currently stored in this browser. Export your current data first if you need to keep it.</div></div>
<div class="card"><div class="card-head"><div class="card-title">Your workspace</div><span class="stat-icon">✦</span></div><div class="legend-list"><div class="legend-line"><span class="muted">Subjects</span><strong>${Object.keys(SUBJECTS).length}</strong></div><div class="legend-line"><span class="muted">Syllabus entries</span><strong>${getAllItems().length}</strong></div><div class="legend-line"><span class="muted">Sample papers</span><strong>64 slots</strong></div><div class="legend-line"><span class="muted">Study sessions</span><strong>${state.sessions.length}</strong></div><div class="legend-line"><span class="muted">Tasks</span><strong>${state.tasks.length}</strong></div><div class="legend-line"><span class="muted">Events</span><strong>${state.events.length}</strong></div></div></div>
<div class="card danger-zone"><div class="card-head"><div class="card-title">Reset workspace</div><span class="tag bad">Caution</span></div><p class="tiny muted">This clears all locally saved progress, study sessions, tasks, events and settings, returning StudySpace to its original syllabus. Export a backup first.</p><button class="btn danger" data-action="reset">Reset all data</button></div></div><div class="footer-note">StudySpace works offline after the page has loaded. Your data is stored locally in this browser, not in your GitHub repository.</div>`}
function bindView(){/* all interactions use delegated listeners below */}
// Global event delegation

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
if(a==='navigate')go(el.dataset.view);
else if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';persist();setTheme();if(currentView==='settings')render()}
else if(a==='theme-switch'){state.theme=el.checked?'dark':'light';persist();setTheme()}
else if(a==='subject'){activeSubject=el.dataset.subject;syllabusFilter='all';render()}
else if(a==='add-chapter'){showAddChapter=true;render()}
else if(a==='cancel-chapter'){showAddChapter=false;render()}
else if(a==='task-toggle'){const t=state.tasks.find(x=>x.id===el.dataset.id);if(t){t.status=el.checked?'done':'open';persist();render()}}
else if(a==='delete-task'){state.tasks=state.tasks.filter(x=>x.id!==el.dataset.id);persist();render()}
else if(a==='timer-mode')changeTimerMode(el.dataset.mode)
else if(a==='timer-start')timerStartPause()
else if(a==='timer-reset')timerReset()
else if(a==='focus-mode'){focusMode=!focusMode;render()}
else if(a==='sound')startSound(el.dataset.sound)
else if(a==='calendar-prev'){calendarCursor.setMonth(calendarCursor.getMonth()-1);render()}
else if(a==='calendar-next'){calendarCursor.setMonth(calendarCursor.getMonth()+1);render()}
else if(a==='calendar-today'){calendarCursor=new Date();selectedDate=todayISO();render()}
else if(a==='select-date'){selectedDate=el.dataset.date;render()}
else if(a==='delete-event'){state.events=state.events.filter(x=>x.id!==el.dataset.id);persist();render()}
else if(a==='export')exportBackup()
else if(a==='import')document.getElementById('importFile').click()
else if(a==='reset'){if(confirm('Reset all StudySpace data in this browser? This cannot be undone unless you have an exported backup.')){state=freshState();persist();timerReset();activeSubject='science';render();toast('Workspace reset')}}
else if(a==='delete-chapter'){if(confirm('Remove this custom syllabus entry?')){state.syllabus[activeSubject]=state.syllabus[activeSubject].filter(x=>x.id!==el.dataset.id);persist();render()}}
});
document.addEventListener('change',e=>{const el=e.target,a=el.dataset.action;
if(a==='chapter-check'){const item=state.syllabus[activeSubject].find(x=>x.id===el.dataset.id);if(item){item.checks[el.dataset.field]=el.checked;if(el.dataset.field.startsWith('Revision')&&el.checked)item.revisionDates[el.dataset.field]=todayISO();persist();if(!['science','maths','sst'].includes(activeSubject))render();}}
else if(a==='chapter-select'){const item=state.syllabus[activeSubject].find(x=>x.id===el.dataset.id);if(item){item[el.dataset.field]=el.value;persist();if(el.dataset.field==='confidence'||el.dataset.field==='status')render()}}
else if(a==='syllabus-filter'){syllabusFilter=el.value;render()}
else if(a==='paper-toggle'){const p=state.papers[el.dataset.subject].find(x=>x.number===Number(el.dataset.number));if(p){p.done=el.checked;persist();render()}}
else if(a==='paper-field'){const p=state.papers[el.dataset.subject].find(x=>x.number===Number(el.dataset.number));if(p){p[el.dataset.field]=el.value;persist();if(el.dataset.field==='date'||el.dataset.field==='marks')toast('Paper details saved')}}
else if(a==='daily-date'){selectedDate=el.value||todayISO();render()}
else if(a==='timer-subject'){timer.subject=el.value}
else if(a==='countdown-setting'&&!timer.running){const mins=Math.min(600,Math.max(1,Number(el.value)||1));timer.remaining=mins*60;timer.runDuration=0;updateTimerDisplay()}
else if(a==='volume'){state.settings.soundVolume=Number(el.value)/100;if(audioGain)audioGain.gain.value=state.settings.soundVolume;persist()}
else if(el.dataset.setting){const key=el.dataset.setting,val=Number(el.value);if(Number.isFinite(val)&&val>0){state.settings[key]=Math.min(key==='dailyGoal'?1440:600,Math.max(1,val));persist();if(key.startsWith('pomodoro')&&currentView==='focus'&&!timer.running){timerReset()}}}
});
document.addEventListener('input',e=>{const el=e.target,a=el.dataset.action;if(a==='chapter-note'){const item=state.syllabus[activeSubject].find(x=>x.id===el.dataset.id);if(item){item.note=el.value;persist()}}else if(a==='timer-task'){timer.taskTitle=el.value}else if(a==='paper-field'){const p=state.papers[el.dataset.subject]?.find(x=>x.number===Number(el.dataset.number));if(p){p[el.dataset.field]=el.value;persist()}}});
document.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();const data=Object.fromEntries(new FormData(form).entries());
if(form.dataset.form==='chapter'){const cfg=SUBJECTS[activeSubject];state.syllabus[activeSubject].push({...mkItem(data.name,cfg.fields,data.section),custom:true});showAddChapter=false;persist();render();toast('Chapter added')}
else if(form.dataset.form==='task'){state.tasks.push({id:uid(),title:data.title,subject:data.subject,date:data.date||todayISO(),minutes:Number(data.minutes)||0,status:'open',createdAt:Date.now()});persist();render();toast('Study task added')}
else if(form.dataset.form==='manual-session'){const minutes=Math.min(1440,Math.max(1,Number(data.minutes)||1));state.sessions.push({id:uid(),date:selectedDate,subject:data.subject||'General',title:data.title||'Study session',seconds:minutes*60,type:'Manual log',createdAt:Date.now()});persist();render();toast('Study session saved')}
else if(form.dataset.form==='event'){state.events.push({id:uid(),title:data.title,date:data.date,type:data.type,notes:data.notes||''});selectedDate=data.date;calendarCursor=new Date(data.date+'T12:00:00');persist();render();toast('Calendar event saved')}
});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const text=await file.text(),parsed=JSON.parse(text);if(!parsed||!parsed.syllabus||!parsed.settings)throw new Error('This does not look like a StudySpace backup.');if(!confirm('Import this backup and replace the data currently stored in this browser?'))return;const base=freshState();state={...base,...parsed,settings:{...base.settings,...parsed.settings},syllabus:{...base.syllabus,...parsed.syllabus},papers:{...base.papers,...parsed.papers}};for(const [k,cfg] of Object.entries(SUBJECTS)){state.syllabus[k]=(state.syllabus[k]||[]).map(it=>({...mkItem(it.name,cfg.fields,it.section||cfg.sections[0].name),...it,checks:{...Object.fromEntries(cfg.fields.map(f=>[f,false])),...(it.checks||{})}}))}persist();render();toast('Backup restored successfully')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}});
function exportBackup(){const payload={...state,exportedAt:new Date().toISOString(),app:'StudySpace'};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`studyspace-backup-${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Backup downloaded')}
// Keep the timer clock display accurate when the tab is inactive.
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&timer.running){timerTick();timer.lastTick=Date.now()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&focusMode){focusMode=false;render()}});
window.addEventListener('beforeunload',()=>{if(timer.running&&timer.mode==='stopwatch'&&timer.elapsed-timer.loggedSeconds>=60){logSession(timer.elapsed-timer.loggedSeconds,'Stopwatch');timer.loggedSeconds=timer.elapsed}});
render();
</script>
</body>
</html>
